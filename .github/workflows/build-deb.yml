name: Build deb

on:
  push:
    branches: [main, ci/**]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  arm64:
    name: Build arm64 deb
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config fakeroot dpkg-dev git curl gnu-tar \
            python3 python3-pip python3-pil \
            fonts-noto-cjk fonts-noto-color-emoji

      - name: Bundle pwnagotchi source
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fsSL \
            https://github.com/jayofelony/pwnagotchi/archive/refs/heads/master.tar.gz \
            -o build/pwnagotchi-master.tar.gz

      - name: Fetch fonts for distribution
        run: chmod +x tools/fetch_fonts.sh && ./tools/fetch_fonts.sh tools/fonts

      - name: Build .deb
        run: |
          chmod +x build.sh tools/package_applaunch.sh
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            export PWNAGOTCHI_VERSION="${GITHUB_REF_NAME#v}"
            echo "Using tag-derived package version: $PWNAGOTCHI_VERSION"
          fi
          ./build.sh --device --package

      - name: Show deb metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(build/cardputerzero-pwnagotchi_*_arm64.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "No .deb files found in build/"
            exit 1
          fi
          deb="${debs[0]}"
          echo "=== $deb ==="
          dpkg-deb -I "$deb"
          echo "=== contents ==="
          dpkg-deb -c "$deb" | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: cardputerzero-pwnagotchi-arm64-deb
          path: build/cardputerzero-pwnagotchi_*_arm64.deb
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.6.2
        with:
          files: build/cardputerzero-pwnagotchi_*_arm64.deb

  prerelease:
    needs: arm64
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cardputerzero-pwnagotchi-arm64-deb
          path: artifacts/

      - name: Generate release tag
        id: tag
        run: echo "tag=pwnagotchi-$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create prerelease
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Pwnagotchi Prerelease ${{ steps.tag.outputs.tag }}"
          prerelease: true
          generate_release_notes: true
          files: artifacts/**/*
